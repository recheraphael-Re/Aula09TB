name: Build e testes IMC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar, testar e gerar JAR
        run: mvn -B clean verify
      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: calc-imc
          path: target/*.jar
          if-no-files-found: error
